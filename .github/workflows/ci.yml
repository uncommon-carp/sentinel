name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  push-image:
    name: build + push ECR image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WEIR_GHA_ROLE_ARN }}
          aws-region: ${{ vars.WEIR_AWS_REGION }}
      - name: build + push
        run: |
          aws ecr get-login-password --region ${{ vars.WEIR_AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              $(echo ${{ vars.WEIR_ECR_SENTINEL_REPO }} | cut -d/ -f1)
          SHA=$(git rev-parse --short HEAD)
          docker build --platform linux/amd64 \
            -t ${{ vars.WEIR_ECR_SENTINEL_REPO }}:latest \
            -t ${{ vars.WEIR_ECR_SENTINEL_REPO }}:${SHA} .
          docker push ${{ vars.WEIR_ECR_SENTINEL_REPO }}:latest
          docker push ${{ vars.WEIR_ECR_SENTINEL_REPO }}:${SHA}
